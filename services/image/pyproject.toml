[project]
name = "image"
version = "0.1.0"
description = "Civic Issue Tracker Image Service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aio-pika==10.1.0",
    "boto3==1.43.107",
    "certifi==2026.10.19",
    "cryptography==50.0.2",
    "fastapi==0.142.2",
    "jsonschema==4.26.0",
    "pillow==13.0.0",
    "psycopg==3.3.6",
    "psycopg-binary==3.3.6",
    "psycopg-pool==3.3.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.15.1",
    "python-multipart==0.0.32",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "testcontainers==4.15.0",
]

[tool.uv]
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
# security fix GHSA-6q48-6c7w-9gw2, published 2026-10-20; remove once older than the global cutoff
certifi = false
# security fix GHSA-58r4-6rv3-gfh8, GHSA-65qm-jvmh-6pqg, GHSA-8g5g-8vmr-9782, GHSA-c6hw-5grf-ff96, GHSA-p4wg-p73j-c528, GHSA-pchr-8j38-3x4p, GHSA-q45j-58j2-45rg, published 2026-10-16; remove once older than the global cutoff
pillow = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "D", "S", "SIM"]
ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D107",  # Missing docstring in __init__
    "D203",  # 1 blank line before class
    "D213",  # Multi-line docstring summary should start at the second line
    "ANN401", # Dynamically typed expressions (Any)
    "B008",  # Do not perform function call in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "D", "S105", "S106", "E501"]
"healthcheck.py" = ["S310"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/migrate.py",
]

[tool.coverage.report]
fail_under = 60
show_missing = true
