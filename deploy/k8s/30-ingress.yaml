apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civic-ingress
  namespace: civic-app
  labels:
    app.kubernetes.io/name: civic-ingress
    app.kubernetes.io/part-of: civic-issue-tracker
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - nagriksetu.duckdns.org
      secretName: nagriksetu-tls
  rules:
    - host: nagriksetu.duckdns.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3000
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
