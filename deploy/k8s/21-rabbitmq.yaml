apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: civic-data
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: civic-issue-tracker
spec:
  type: ClusterIP
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
      protocol: TCP
  selector:
    app.kubernetes.io/name: rabbitmq
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: civic-data
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: civic-issue-tracker
  annotations:
    checkov.io/skip1: CKV_K8S_22=Upstream rabbitmq image requires writable filesystem for runtime configuration and state
    checkov.io/skip2: CKV_K8S_23=Upstream entrypoint starts as root and drops privileges requiring capabilities
    checkov.io/skip3: CKV_K8S_25=Upstream entrypoint requires capabilities to fix permissions and drop to rabbitmq user
    checkov.io/skip4: CKV_K8S_35=Credentials are read from environment variables by the upstream rabbitmq image
    checkov.io/skip5: CKV_K8S_40=Upstream entrypoint starts as root to fix data-dir ownership then drops privileges
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: civic-issue-tracker
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.5-management-alpine@sha256:b3b8b7f95f5382a19f9ea33540e604f30aad081d37ad9aba72255135765373a1
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
              protocol: TCP
            - name: management
              containerPort: 15672
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            # Entrypoint starts as root, fixes data-dir ownership, then drops to the service user
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_DEFAULT_USER
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_DEFAULT_PASS
          startupProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 5672
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rabbitmq-netpol
  namespace: civic-data
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: civic-app
      ports:
        - protocol: TCP
          port: 5672
