apiVersion: v1
kind: Service
metadata:
  name: {{ include "civic-service.fullname" . }}
  labels:
    {{- include "civic-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "civic-service.selectorLabels" . | nindent 4 }}
