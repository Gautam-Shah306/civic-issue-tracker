{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "civic-service.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "civic-service.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    checkov.io/skip1: CKV_K8S_35=Database migration credentials read from environment variables via secretKeyRef
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "civic-service.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser | default 65532 }}
        runAsGroup: {{ .Values.securityContext.runAsGroup | default 65532 }}
        seccompProfile:
          type: RuntimeDefault
      {{- $baseEnv := default dict .Values.env }}
      {{- $overrideEnv := default dict .Values.migrate.env }}
      {{- $mergedEnv := merge $overrideEnv $baseEnv }}
      {{- $waitForDb := default dict .Values.migrate.waitForDb }}
      {{- if default true $waitForDb.enabled }}
      initContainers:
        - name: wait-for-db
          image: {{ required "waitForDb.image must be set" .Values.waitForDb.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /bin/sh
            - -c
            - |
              timeout={{ default 120 $waitForDb.timeoutSeconds }}
              elapsed=0
              until pg_isready -q -h "${DB_HOST:-{{ $mergedEnv.DB_HOST | default "postgres.civic-data.svc.cluster.local" }}}" -p "${DB_PORT:-{{ $mergedEnv.DB_PORT | default "5432" }}}" -t 2; do
                elapsed=$((elapsed + 2))
                if [ "$elapsed" -ge "$timeout" ]; then
                  echo "postgres not reachable after about ${timeout} s" >&2
                  exit 1
                fi
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          env:
            - name: DB_HOST
              value: {{ $mergedEnv.DB_HOST | default "postgres.civic-data.svc.cluster.local" | quote }}
            - name: DB_PORT
              value: {{ $mergedEnv.DB_PORT | default "5432" | quote }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "civic-service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          args:
            {{- toYaml .Values.migrate.args | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: {{ .Values.migrate.resources.requests.cpu | default "50m" }}
              memory: {{ .Values.migrate.resources.requests.memory | default "64Mi" }}
            limits:
              cpu: {{ .Values.migrate.resources.limits.cpu | default "500m" }}
              memory: {{ .Values.migrate.resources.limits.memory | default "256Mi" }}
          volumeMounts:
            {{- range $i, $path := .Values.tmpPaths }}
            - name: tmp-{{ $i }}
              mountPath: {{ $path }}
            {{- end }}
          env:
            {{- $baseEnv := default dict .Values.env }}
            {{- $overrideEnv := default dict .Values.migrate.env }}
            {{- $mergedEnv := merge $overrideEnv $baseEnv }}
            {{- range $key, $val := $mergedEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- $secrets := default .Values.secretEnv .Values.migrate.secretEnv }}
            {{- range $s := $secrets }}
            - name: {{ $s.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $s.secretName }}
                  key: {{ $s.key }}
                  optional: {{ default false $s.optional }}
            {{- end }}
      volumes:
        {{- range $i, $path := .Values.tmpPaths }}
        - name: tmp-{{ $i }}
          emptyDir: {}
        {{- end }}
{{- end }}
