service:
  name: frontend
  port: 8080

image:
  repository: ghcr.io/gautam-shah306/civic-frontend

replicas: 2

pdb:
  enabled: true
  minAvailable: 1

hpa:
  enabled: false

securityContext:
  runAsUser: 101
  runAsGroup: 101

tmpPaths:
  - /tmp
  - /var/cache/nginx
  - /var/run

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 200m
    memory: 64Mi

probes:
  startup:
    path: /healthz
    periodSeconds: 2
    failureThreshold: 30
  liveness:
    path: /healthz
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /healthz
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

env: {}

secretEnv: []

migrate:
  enabled: false

networkPolicy:
  allowFrom:
    - traefik
  allowTo: []
