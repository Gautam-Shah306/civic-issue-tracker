service:
  name: gateway
  port: 3000

image:
  repository: ghcr.io/gautam-shah306/civic-gateway

replicas: 2

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  PORT: "3000"
  AUTH_SERVICE_URL: http://auth:3000
  REPORT_SERVICE_URL: http://report:3000
  ANALYTICS_URL: http://analytics:3000
  ROUTING_URL: http://routing:8000
  IMAGE_URL: http://image:8000
  UPSTREAM_TIMEOUT_MS: "10000"
  CORS_ORIGINS: https://nagriksetu.duckdns.org
  TRUST_PROXY: "1"

secretEnv:
  - name: REDIS_URL
    secretName: gateway-secrets
    key: REDIS_URL
  - name: JWT_PUBLIC_KEY_B64
    secretName: jwt-public
    key: JWT_PUBLIC_KEY_B64

migrate:
  enabled: false

networkPolicy:
  allowFrom:
    - traefik
  allowTo:
    - auth
    - report
    - analytics
    - routing
    - image
    - redis
