service:
  name: analytics
  port: 3000

image:
  repository: ghcr.io/gautam-shah306/civic-analytics

replicas: 1

pdb:
  enabled: false

hpa:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

env:
  PORT: "3000"
  DB_HOST: postgres.civic-data.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: civic_analytics
  DB_USER: civic_analytics_rw
  CONTRACTS_DIR: /app/contracts

secretEnv:
  - name: DB_PASSWORD
    secretName: analytics-secrets
    key: DB_PASSWORD
  - name: RABBITMQ_URL
    secretName: analytics-secrets
    key: RABBITMQ_URL
  - name: JWT_PUBLIC_KEY_B64
    secretName: jwt-public
    key: JWT_PUBLIC_KEY_B64

migrate:
  enabled: true
  args:
    - dist/migrate.js
  env:
    DB_USER: civic_analytics
  secretEnv:
    - name: DB_PASSWORD
      secretName: analytics-secrets
      key: MIGRATE_DB_PASSWORD
    - name: RABBITMQ_URL
      secretName: analytics-secrets
      key: RABBITMQ_URL
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

networkPolicy:
  allowFrom:
    - gateway
  allowTo:
    - postgres
    - rabbitmq
