publicHost: nagriksetu.duckdns.org
dataNamespace: civic-data
imageRegistry: ghcr.io/gautam-shah306

peers:
  traefik:
    namespace: kube-system
    matchLabels:
      app.kubernetes.io/name: traefik
  gateway:
    namespace: civic-app
    matchLabels:
      app.kubernetes.io/name: gateway
    port: 3000
  auth:
    namespace: civic-app
    matchLabels:
      app.kubernetes.io/name: auth
    port: 3000
  report:
    namespace: civic-app
    matchLabels:
      app.kubernetes.io/name: report
    port: 3000
  notification:
    namespace: civic-app
    matchLabels:
      app.kubernetes.io/name: notification
    port: 3000
  analytics:
    namespace: civic-app
    matchLabels:
      app.kubernetes.io/name: analytics
    port: 3000
  routing:
    namespace: civic-app
    matchLabels:
      app.kubernetes.io/name: routing
    port: 8000
  image:
    namespace: civic-app
    matchLabels:
      app.kubernetes.io/name: image
    port: 8000
  frontend:
    namespace: civic-app
    matchLabels:
      app.kubernetes.io/name: frontend
    port: 8080
  postgres:
    namespace: civic-data
    matchLabels:
      app.kubernetes.io/name: postgres
    port: 5432
  rabbitmq:
    namespace: civic-data
    matchLabels:
      app.kubernetes.io/name: rabbitmq
    port: 5672
  redis:
    namespace: civic-data
    matchLabels:
      app.kubernetes.io/name: redis
    port: 6379
  seaweedfs:
    namespace: civic-data
    matchLabels:
      app.kubernetes.io/name: seaweedfs
    port: 8333
  mailpit:
    namespace: civic-data
    matchLabels:
      app.kubernetes.io/name: mailpit
    port: 1025
