name: Report Service CI

on:
  push:
    branches:
      - main
    paths:
      - 'services/report/**'
      - '.github/workflows/node-service.yml'
      - 'contracts/**'
  pull_request:
    paths:
      - 'services/report/**'
      - '.github/workflows/node-service.yml'
      - 'contracts/**'
  workflow_dispatch:

permissions: {}

jobs:
  test-report:
    permissions:
      contents: read
    uses: ./.github/workflows/node-service.yml
    with:
      service: report
