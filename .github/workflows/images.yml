name: Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  schedule:
    - cron: '0 0 * * 0' # Weekly scan every Sunday at 00:00 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-scan:
    name: Build & Scan (${{ matrix.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth
          - report
          - notification
          - analytics
          - routing
          - image
          - gateway
          - frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Scanners
        run: |
          sh .github/scripts/install-tools.sh hadolint syft grype

      - name: Lint Dockerfile with Hadolint
        run: |
          hadolint "services/${{ matrix.service }}/Dockerfile"

      - name: Build Container Image
        run: |
          docker build --platform linux/amd64 -f "services/${{ matrix.service }}/Dockerfile" --build-arg SERVICE="${{ matrix.service }}" -t "civic-${{ matrix.service }}:ci" .

      - name: Generate Syft SBOM (CycloneDX JSON)
        run: |
          syft "civic-${{ matrix.service }}:ci" -o cyclonedx-json > "sbom-${{ matrix.service }}.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "sbom-${{ matrix.service }}"
          path: "sbom-${{ matrix.service }}.json"
          retention-days: 30

      - name: Check Vulnerability Allowlist & Build Ignore Config
        run: |
          touch .grype.yaml
          IGNORED_IDS=$(sh .github/scripts/check-allowlist.sh)
          if [ -n "${IGNORED_IDS}" ]; then
            echo "ignore:" >> .grype.yaml
            for id in ${IGNORED_IDS}; do
              echo "  - vulnerability: ${id}" >> .grype.yaml
            done
          fi

      - name: Grype Database Staleness Check
        run: |
          # Verify Grype vulnerability database is not older than 5 days (D-054)
          DB_BUILT=$(grype db status -o json | jq -r '.built // empty')
          if [ -z "${DB_BUILT}" ]; then
            echo "WARNING: Grype DB built timestamp empty, updating db..."
            grype db update
            DB_BUILT=$(grype db status -o json | jq -r '.built // empty')
          fi
          echo "Grype DB built timestamp: ${DB_BUILT}"
          DB_TS=$(date -d "${DB_BUILT}" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%SZ" "${DB_BUILT}" +%s 2>/dev/null || echo 0)
          NOW_TS=$(date +%s)
          DIFF_DAYS=$(( (NOW_TS - DB_TS) / 86400 ))
          echo "Grype DB age in days: ${DIFF_DAYS}"
          if [ "${DIFF_DAYS}" -gt 5 ]; then
            echo "ERROR: Grype database is ${DIFF_DAYS} days old (> 5 days threshold)" >&2
            exit 1
          fi

      - name: Scan Image with Grype
        run: |
          mkdir -p scan-results
          grype "civic-${{ matrix.service }}:ci" -c .grype.yaml -o table > "scan-results/scan-${{ matrix.service }}.txt"
          cat "scan-results/scan-${{ matrix.service }}.txt"

          echo "### Grype Scan Results: civic-${{ matrix.service }}:ci" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          cat "scan-results/scan-${{ matrix.service }}.txt" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"

          # Fail on High or Critical findings with fix available
          grype "civic-${{ matrix.service }}:ci" -c .grype.yaml --only-fixed --fail-on high

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "scan-${{ matrix.service }}"
          path: "scan-results/scan-${{ matrix.service }}.txt"
          retention-days: 30

      - name: Save Image Tar
        run: |
          docker save "civic-${{ matrix.service }}:ci" -o "image-${{ matrix.service }}.tar"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "image-${{ matrix.service }}"
          path: "image-${{ matrix.service }}.tar"
          retention-days: 1

  kind-install:
    name: Minimal Kind Install & Smoke Test
    needs: build-scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tools
        run: |
          sh .github/scripts/install-tools.sh kind kubectl helm

      - name: Download Image Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "image-*"
          path: images/
          merge-multiple: true

      - name: Load Images into Docker Daemon
        run: |
          for tar_file in images/image-*.tar; do
            echo "Loading ${tar_file}..."
            docker load -i "${tar_file}"
          done

      - name: Create Kind Cluster
        run: |
          kind create cluster --image "kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0"

      - name: Load Images into Kind
        run: |
          for svc in auth report notification analytics routing image gateway frontend; do
            echo "Loading civic-${svc}:ci into kind..."
            kind load docker-image "civic-${svc}:ci"
          done

      - name: Apply Namespaces and Network Baseline
        run: |
          # Note: kind's default CNI does enforce NetworkPolicies (D-055), so the install job actively tests them.
          kubectl apply -f deploy/k8s/00-namespaces.yaml
          kubectl apply -f deploy/k8s/10-network-baseline.yaml

      - name: Generate Throwaway Secrets
        run: |
          sh .github/scripts/kind-secrets.sh

      - name: Create db-init-script ConfigMap
        run: |
          kubectl create configmap db-init-script \
            --from-file=db-init.sh=deploy/compose/db-init/db-init.sh \
            -n civic-data --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Data Stores
        run: |
          kubectl apply -f deploy/k8s/20-postgres.yaml
          kubectl apply -f deploy/k8s/21-rabbitmq.yaml
          kubectl apply -f deploy/k8s/22-redis.yaml
          kubectl apply -f deploy/k8s/23-seaweedfs.yaml
          kubectl apply -f deploy/k8s/24-mailpit.yaml

          echo "Waiting for data store rollouts in civic-data..."
          kubectl rollout status statefulset/postgres -n civic-data --timeout=180s
          kubectl rollout status statefulset/rabbitmq -n civic-data --timeout=180s
          kubectl rollout status statefulset/redis -n civic-data --timeout=180s
          kubectl rollout status statefulset/seaweedfs -n civic-data --timeout=180s
          kubectl rollout status deployment/mailpit -n civic-data --timeout=180s

      - name: Run DB Init Job
        run: |
          kubectl apply -f deploy/k8s/25-db-init-job.yaml
          kubectl wait --for=condition=complete --timeout=120s job/db-init -n civic-data

      - name: Deploy Application Microservices via Helm
        run: |
          for svc in auth report notification analytics routing image gateway frontend; do
            echo "--> Installing Helm release: ${svc}..."
            helm upgrade --install "${svc}" deploy/helm/civic-service \
              -n civic-app \
              -f deploy/helm/values/_common.yaml \
              -f "deploy/helm/values/${svc}.yaml" \
              --set "image.repository=civic-${svc}" \
              --set image.tag=ci \
              --set image.pullPolicy=Never \
              --atomic --wait --timeout 5m
          done

      - name: List Pods and Helm Releases
        run: |
          echo "=== All Pods across Namespaces ==="
          kubectl get pods -A -o wide
          echo "=== Helm Releases in civic-app ==="
          helm list -n civic-app

      - name: Smoke Test Services via Port-Forward
        run: |
          echo "Port-forwarding Gateway (3000)..."
          kubectl port-forward -n civic-app svc/gateway 3000:3000 >/dev/null 2>&1 &
          PID_GW=$!

          echo "Port-forwarding Frontend (8080)..."
          kubectl port-forward -n civic-app svc/frontend 8080:8080 >/dev/null 2>&1 &
          PID_FE=$!

          sleep 5

          echo "--> Testing Gateway /readyz (expected HTTP 200)..."
          curl -fsS -o /dev/null -w "Gateway /readyz HTTP %{http_code}\n" http://127.0.0.1:3000/readyz

          echo "--> Testing Gateway /.well-known/jwks.json (expected HTTP 200)..."
          curl -fsS -o /dev/null -w "Gateway /.well-known/jwks.json HTTP %{http_code}\n" http://127.0.0.1:3000/.well-known/jwks.json

          echo "--> Testing Frontend /healthz (expected HTTP 200)..."
          curl -fsS -o /dev/null -w "Frontend /healthz HTTP %{http_code}\n" http://127.0.0.1:8080/healthz

          kill "${PID_GW}" "${PID_FE}" 2>/dev/null || true

      - name: Debug Cluster on Failure
        if: failure()
        run: |
          echo "=== FAILURE DIAGNOSTICS ==="
          kubectl get pods -A -o wide
          echo "=== Describe Pods (civic-app) ==="
          kubectl describe pods -n civic-app
          echo "=== Describe Pods (civic-data) ==="
          kubectl describe pods -n civic-data
          for pod in $(kubectl get pods -n civic-app -o jsonpath='{.items[*].metadata.name}'); do
            echo "=== Logs for civic-app/${pod} ==="
            kubectl logs -n civic-app "${pod}" --all-containers --tail=100 || true
          done
          for pod in $(kubectl get pods -n civic-data -o jsonpath='{.items[*].metadata.name}'); do
            echo "=== Logs for civic-data/${pod} ==="
            kubectl logs -n civic-data "${pod}" --all-containers --tail=100 || true
          done

  gate:
    name: Completion Gate (All Workflows on Commit)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for All Other Workflow Runs on Head SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          echo "Polling workflow runs for commit ${HEAD_SHA} on ${REPO}..."
          start_time=$(date +%s)
          max_duration=$((45 * 60)) # at most 45 minutes

          while true; do
            now=$(date +%s)
            elapsed=$((now - start_time))
            if [ "${elapsed}" -ge "${max_duration}" ]; then
              echo "ERROR: Timed out waiting for other workflows after 45 minutes" >&2
              exit 1
            fi

            runs_json=$(gh api "repos/${REPO}/actions/runs?head_sha=${HEAD_SHA}&per_page=100")

            set +e
            echo "${runs_json}" | sh .github/scripts/gate-check.sh "${CURRENT_RUN_ID}"
            gate_rc=$?
            set -e

            if [ "${gate_rc}" -eq 0 ]; then
              echo "Gate verification passed: all workflows on commit ${HEAD_SHA} succeeded."
              break
            elif [ "${gate_rc}" -eq 10 ]; then
              echo "Waiting for active workflow runs to complete..."
              sleep 30
            else
              echo "ERROR: Gate check failed with exit code ${gate_rc}" >&2
              exit 1
            fi
          done

  publish:
    name: Publish Images to GHCR
    needs: [build-scan, kind-install, gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download Image Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "image-*"
          path: images/
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and Push Images to GHCR
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          OWNER_LOWER=$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "{" > image-digests.json
          first=1

          echo "### Published Images to GHCR" >> "${GITHUB_STEP_SUMMARY}"
          echo "| Service | Published Tag | Digest |" >> "${GITHUB_STEP_SUMMARY}"
          echo "|---|---|---|" >> "${GITHUB_STEP_SUMMARY}"

          for svc in auth report notification analytics routing image gateway frontend; do
            tar_file="images/image-${svc}.tar"
            echo "Loading ${tar_file}..."
            docker load -i "${tar_file}"

            target_tag="ghcr.io/${OWNER_LOWER}/civic-${svc}:${COMMIT_SHA}"
            echo "Tagging civic-${svc}:ci -> ${target_tag}"
            docker tag "civic-${svc}:ci" "${target_tag}"

            echo "Pushing ${target_tag}..."
            docker push "${target_tag}"

            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "${target_tag}" 2>/dev/null || docker inspect --format='{{.Id}}' "${target_tag}")
            echo "Pushed digest for civic-${svc}: ${digest}"

            if [ "${first}" -eq 1 ]; then
              first=0
            else
              echo "," >> image-digests.json
            fi
            echo "  \"civic-${svc}\": \"${digest}\"" >> image-digests.json
            echo "| civic-${svc} | \`${target_tag}\` | \`${digest}\` |" >> "${GITHUB_STEP_SUMMARY}"
          done

          echo "}" >> image-digests.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digests
          path: image-digests.json
          retention-days: 30

  deploy:
    name: Deploy to Production VM (IAP Tunnel)
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Image Digests Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-digests
          path: .

      - name: Authenticate to Google Cloud via WIF
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SA }}
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
        run: |
          sh .github/scripts/gcp-auth.sh

      - name: Prepare Workspace Directory on Production VM
        env:
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
        run: |
          echo "--> Initializing ~/workspace on VM..."
          gcloud compute ssh --quiet --tunnel-through-iap \
            --zone="${GCP_ZONE}" \
            "${GCP_INSTANCE}" \
            --command="rm -rf ~/workspace && mkdir -p ~/workspace"

      - name: Transfer Deployment Artifacts to Production VM via IAP
        env:
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
        run: |
          echo "--> Transferring deploy directory, image-digests.json, and scripts to VM..."
          gcloud compute scp --quiet --recurse --tunnel-through-iap \
            --zone="${GCP_ZONE}" \
            deploy image-digests.json .github/scripts/deploy-remote.sh \
            "${GCP_INSTANCE}:~/workspace/"

      - name: Execute Remote Deployment via IAP Tunnel
        env:
          GCP_ZONE: ${{ vars.GCP_ZONE }}
          GCP_INSTANCE: ${{ vars.GCP_INSTANCE }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "--> Running deploy-remote.sh on VM with sudo..."
          gcloud compute ssh --quiet --tunnel-through-iap \
            --zone="${GCP_ZONE}" \
            "${GCP_INSTANCE}" \
            --command="sudo bash ~/workspace/deploy-remote.sh ${COMMIT_SHA}"

      - name: Public Smoke Test
        env:
          PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
          CERT_ISSUER: ${{ vars.CERT_ISSUER }}
        run: |
          ISSUER="${CERT_ISSUER:-letsencrypt-staging}"
          max_retries=12
          interval=10

          echo "--> Running smoke tests for host https://${PUBLIC_HOST} in mode: ${ISSUER}"

          if [ "${ISSUER}" = "letsencrypt-prod" ]; then
            echo "--> Production mode: verifying HTTPS endpoints..."
            test_https() {
              url="$1"
              echo "Testing ${url}..."
              for i in $(seq 1 "${max_retries}"); do
                http_code=$(curl -sS -o /dev/null -w "%{http_code}" "${url}" || true)
                if [ "${http_code}" = "200" ]; then
                  echo "  [PASS] ${url} returned HTTP 200 (attempt ${i})"
                  return 0
                fi
                echo "  Attempt ${i}/${max_retries}: returned HTTP ${http_code}. Retrying in ${interval}s..."
                sleep "${interval}"
              done
              echo "ERROR: Smoke test failed for ${url} after ${max_retries} attempts" >&2
              return 1
            }

            test_https "https://${PUBLIC_HOST}/healthz"
            test_https "https://${PUBLIC_HOST}/.well-known/jwks.json"
            test_https "https://${PUBLIC_HOST}/api/v1/public/reports"
            echo "Production HTTPS smoke tests passed successfully."
          else
            echo "--> Staging mode: verifying HTTP redirect and staging certificate..."
            redirect_ok=0
            for i in $(seq 1 "${max_retries}"); do
              http_info=$(curl -sS -o /dev/null -w "%{http_code} %{redirect_url}" "http://${PUBLIC_HOST}/healthz" || true)
              status=$(echo "${http_info}" | awk '{print $1}')
              loc=$(echo "${http_info}" | awk '{print $2}')
              if [ "${status}" = "301" ] || [ "${status}" = "308" ]; then
                case "${loc}" in
                  https://*)
                    echo "  [PASS] http://${PUBLIC_HOST}/healthz redirected to ${loc} with HTTP ${status} (attempt ${i})"
                    redirect_ok=1
                    break
                    ;;
                esac
              fi
              echo "  Attempt ${i}/${max_retries}: HTTP redirect returned status ${status}, loc ${loc}. Retrying in ${interval}s..."
              sleep "${interval}"
            done

            if [ "${redirect_ok}" -ne 1 ]; then
              echo "ERROR: HTTP to HTTPS redirect verification failed" >&2
              exit 1
            fi

            cert_ok=0
            for i in $(seq 1 "${max_retries}"); do
              issuer_str=$(echo | openssl s_client -connect "${PUBLIC_HOST}:443" -servername "${PUBLIC_HOST}" 2>/dev/null | openssl x509 -noout -issuer 2>/dev/null || true)
              if echo "${issuer_str}" | grep -qi "STAGING"; then
                echo "  [PASS] TLS certificate issuer verified containing STAGING: ${issuer_str} (attempt ${i})"
                cert_ok=1
                break
              fi
              echo "  Attempt ${i}/${max_retries}: issuer was '${issuer_str}'. Retrying in ${interval}s..."
              sleep "${interval}"
            done

            if [ "${cert_ok}" -ne 1 ]; then
              echo "ERROR: TLS certificate issuer verification failed (expected STAGING in issuer)" >&2
              exit 1
            fi
            echo "Staging smoke tests passed successfully."
          fi
