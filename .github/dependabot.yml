version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/deploy/compose"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Infrastructure image upgrades (Postgres, RabbitMQ, Redis, SeaweedFS, Mailpit) are manual decisions that need a data plan; only patch updates are proposed
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directories:
      - "/contracts"
      - "/services/auth"
      - "/services/report"
      - "/services/gateway"
      - "/services/notification"
      - "/services/analytics"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        group-by: dependency-name
        update-types:
          - "minor"
          - "patch"
    # Major upgrades are manual decisions (Node 25 is not LTS; TypeScript 7 is blocked by the typescript-eslint peer range; @types/node must match the Node 24 runtime; infrastructure image majors need a data plan)
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directories:
      - "/services/auth"
      - "/services/report"
      - "/services/gateway"
      - "/services/notification"
      - "/services/analytics"
      - "/services/routing"
      - "/services/image"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        group-by: dependency-name
        update-types:
          - "minor"
          - "patch"
    # Major upgrades are manual decisions (Node 25 is not LTS; TypeScript 7 is blocked by the typescript-eslint peer range; @types/node must match the Node 24 runtime; infrastructure image majors need a data plan)
    # Python and uv minor upgrades are manual decisions (Python 3.13 matches the distroless runtime and the site-packages path in the Dockerfiles; uv 0.x minors can change the lock format)
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "python"
        update-types:
          - "version-update:semver-minor"
      - dependency-name: "ghcr.io/astral-sh/uv"
        update-types:
          - "version-update:semver-minor"
    open-pull-requests-limit: 5

  - package-ecosystem: "uv"
    directories:
      - "/services/routing"
      - "/services/image"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        group-by: dependency-name
        update-types:
          - "minor"
          - "patch"
    # Major upgrades are manual decisions (Node 25 is not LTS; TypeScript 7 is blocked by the typescript-eslint peer range; @types/node must match the Node 24 runtime; infrastructure image majors need a data plan)
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    open-pull-requests-limit: 5
